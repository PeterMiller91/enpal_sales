<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A5C">
<meta name="robots" content="noindex">
<title>Baustellen-Fotos</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #F4F6F5; --surface: #fff; --text: #14201D; --muted: #52605C; --line: #D5DDDA;
  --accent: #0A2A5C; --accent-soft: #E9EEF7; --yellow: #FFD200; --yellow-hover: #F0C400; --yellow-soft: #FFF6CC;
  --warn-soft: #FDEBDD; --warn-ink: #8A3A06;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button { font: inherit; cursor: pointer; }
#app { max-width: 960px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
header.bar { position: sticky; top: 0; z-index: 5; background: var(--accent); color: #fff; border-bottom: 3px solid var(--yellow); padding: calc(10px + env(safe-area-inset-top)) 16px 12px; display: flex; flex-direction: column; gap: 4px; }
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--yellow); }
h1 { margin: 0; font-size: 21px; }
h2 { margin: 0; font-size: 15px; }
.bar .sub { color: #C9D6EE; font-size: 13px; margin: 0; }
.icon-btn { width: 44px; height: 44px; margin-left: -10px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; color: #fff; border-radius: 8px; }
.top-links { display: flex; gap: 4px; }
.top-links button, .top-links a { border: 0; background: none; color: #fff; font-size: 13px; font-weight: 600; padding: 8px; border-radius: 8px; min-height: 40px; text-decoration: none; display: inline-flex; align-items: center; }
main { flex: 1; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
input, textarea, select { font: inherit; font-size: 16px; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; min-height: 44px; width: 100%; min-width: 0; }
textarea { padding: 10px 12px; min-height: 64px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.help { font-size: 12px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--text); font-size: 14px; font-weight: 600; text-decoration: none; }
.btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--accent); }
.btn.primary:hover { background: var(--yellow-hover); }
.btn.blue { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.big { min-height: 56px; font-size: 16px; }
.btn.small { min-height: 36px; font-size: 13px; padding: 0 10px; }
.btn.danger { color: #9F1D1D; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1; }
.hint { display: flex; gap: 8px; align-items: flex-start; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.hint.info { background: var(--accent-soft); color: var(--accent); }
.hint.warn { background: var(--warn-soft); color: var(--warn-ink); }
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.site { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; color: inherit; text-decoration: none; text-align: left; width: 100%; }
.site .cover { width: 72px; height: 72px; border-radius: 8px; background: var(--accent-soft) center/cover no-repeat; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--accent); }
.site .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.site .t1 { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site .t2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site .count { font-size: 12px; font-weight: 700; color: var(--accent); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; min-height: 40px; border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px; padding: 0 12px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.cat[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--accent); }
.chip .n { opacity: .75; font-weight: 500; }
.uploader { position: sticky; top: 0; }
.day { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.day h2 { font-size: 16px; }
.cat-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 0 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--accent-soft); border: 0; padding: 0; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .badge { position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(10, 42, 92, .85); color: #fff; }
.ph .badge.wait { background: var(--yellow); color: var(--accent); }
.ph .check { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgba(10, 42, 92, .35); display: flex; align-items: center; justify-content: center; color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.ph.sel { outline: 3px solid var(--yellow); outline-offset: -3px; }
.ph.sel img { opacity: .8; }
.ph.sel .check { background: var(--yellow); border-color: var(--yellow); }
.selbar { position: sticky; bottom: 0; z-index: 6; background: var(--accent); color: #fff; border-top: 3px solid var(--yellow); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.selbar .count { font-weight: 700; flex: 1; min-width: 110px; }
.selbar .btn { min-height: 40px; }
.selbar .btn.ghost { background: transparent; border-color: rgba(255,255,255,.4); color: #fff; }
@media (max-width: 520px) { .selbar .count { flex-basis: 100%; } .selbar .btn { flex: 1; padding: 0 8px; font-size: 13px; } }
.ph .doc { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent); }
.qitem { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #EEF1F0; }
.qitem:last-child { border-bottom: 0; }
.qitem .qthumb { width: 56px; height: 56px; border-radius: 8px; background: var(--accent-soft) center/cover no-repeat; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--accent); }
.qitem .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.qitem .t1 { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qitem .t2 { font-size: 12px; color: var(--muted); }
.qitem .t2.err { color: #9F1D1D; }
.qitem .qbtns { display: flex; flex-direction: column; gap: 4px; }
.bigbar { height: 12px; border-radius: 6px; background: var(--accent-soft); overflow: hidden; }
.bigbar span, .progress span { transition: width .2s; }
.bigbar span { display: block; height: 100%; background: var(--yellow); }
.qlink { color: var(--accent); font-weight: 700; text-decoration: underline; background: none; border: 0; padding: 0; font-size: 12px; }
.preset { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.preset button { min-height: 56px; border: 1px solid var(--line); border-radius: 10px; background: #fff; text-align: left; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; }
.preset button b { font-size: 14px; }
.preset button span { font-size: 12px; color: var(--muted); }
.preset button[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
input[type=range] { padding: 0; min-height: 32px; accent-color: var(--accent); border: 0; }
.progress { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--yellow); }
/* Großansicht */
#lb { position: fixed; inset: 0; z-index: 30; background: #0B1220; color: #fff; display: flex; flex-direction: column; }
#lb .lb-top { display: flex; align-items: center; justify-content: space-between; padding: calc(8px + env(safe-area-inset-top)) 8px 8px; gap: 8px; }
#lb .lb-top button, #lb .lb-top a { color: #fff; background: none; border: 0; min-height: 44px; min-width: 44px; font-weight: 600; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
#lb .lb-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; touch-action: pan-y; }
#lb .lb-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
#lb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 26px; border-radius: 8px; }
#lb .nav.prev { left: 8px; } #lb .nav.next { right: 8px; }
#lb .lb-info { background: #fff; color: var(--text); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow: auto; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 40; }
dialog.sheet { border: 0; border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); margin: auto auto 0; width: 100%; max-width: 640px; }
dialog.sheet::backdrop { background: rgba(20, 32, 29, .45); }
dialog.sheet form { display: flex; flex-direction: column; gap: 12px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>
<script>
(function () {
  'use strict';
  const $app = document.getElementById('app');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join('');
  const fmtDay = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  const fmtTs = (iso) => (iso ? new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');
  const ls = { get(k, d) { try { const v = localStorage.getItem('bs-' + k); return v ? JSON.parse(v) : d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem('bs-' + k, JSON.stringify(v)); } catch (_) { /* ignore */ } } };
  function toast(msg, ms = 2800) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms); }
  const ICON = {
    back: '<path d="M15 18l-6-6 6-6"/>',
    camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
    site: '<path d="M2 20h20M5 20V9l7-5 7 5v11"/><path d="M9 20v-6h6v6"/>',
  };
  const icon = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

  // ---------------------------------------------------------------- server
  let state = { user: null, sites: [], categories: {} };
  let customers = [];
  let photos = [];
  async function api(route, opts = {}, query = '') {
    const r = await fetch(`api.php?p=${route}${query}`, { credentials: 'same-origin', ...opts });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { state.user = null; viewLogin(); throw Object.assign(new Error('Bitte anmelden'), { status: 401 }); }
    if (!r.ok) throw Object.assign(new Error(data.error || `HTTP ${r.status}`), { status: r.status });
    return data;
  }
  const post = (route, body) => api(route, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  async function load() {
    state = await api('state');
    api('customers').then((c) => (customers = c)).catch(() => {});
  }
  const photoUrl = (id, q = '') => `api.php?p=photos/${id}${q}`;

  // ---------------------------------------------------------------- upload queue (IndexedDB, survives reloads and dead spots)
  const idb = new Promise((res, rej) => {
    const r = indexedDB.open('baustelle-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('queue', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const q = (mode, fn) => idb.then((db) => new Promise((res, rej) => { const t = db.transaction('queue', mode); const s = t.objectStore('queue'); const rq = fn(s); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }));
  const qAll = () => q('readonly', (s) => s.getAll());
  const qPut = (item) => q('readwrite', (s) => s.put(item));
  const qDel = (id) => q('readwrite', (s) => s.delete(id));
  let queueItems = [];
  let uploading = false;
  let progress = '';
  const previewUrls = new Map();
  async function refreshQueue() {
    queueItems = await qAll();
    for (const it of queueItems) if (!previewUrls.has(it.id) && it.blob.type.startsWith('image/')) previewUrls.set(it.id, URL.createObjectURL(it.blob));
  }
  const live = new Map(); // id -> { loaded, total } for the item being uploaded
  let doneBytes = 0, doneCount = 0; // this session
  const paused = () => ls.get('paused', false);

  function upload(it) {
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append('id', it.id);
      fd.append('meta', JSON.stringify(it.meta));
      fd.append('file', it.blob, it.name);
      const x = new XMLHttpRequest();
      x.open('POST', `api.php?p=sites/${it.siteId}/upload`);
      x.upload.onprogress = (e) => { if (e.lengthComputable) { live.set(it.id, { loaded: e.loaded, total: e.total }); renderQueueProgress(); } };
      x.onload = () => {
        let data = {};
        try { data = JSON.parse(x.responseText); } catch (_) { /* ignore */ }
        if (x.status === 401) { state.user = null; viewLogin(); }
        if (x.status >= 200 && x.status < 300) resolve(data);
        else reject(Object.assign(new Error(data.error || (x.status === 413 ? 'Datei zu groß für den Server' : `HTTP ${x.status}`)), { status: x.status }));
      };
      x.onerror = () => reject(new Error('Netzwerkfehler'));
      x.send(fd);
    });
  }

  // ---------------------------------------------------------------- background preparation (EXIF + resize)
  let storing = 0;      // originals being written to IndexedDB right now
  let preparing = false;
  async function prepareQueue() {
    if (preparing) return;
    preparing = true;
    try {
      for (;;) {
        const raw = (await qAll()).filter((it) => it.raw).sort((a, b) => a.added - b.added);
        if (!raw.length) break;
        const it = raw[0];
        const f = it.blob;
        const meta = { ...it.meta };
        let blob = f, name = it.name;
        const isImage = (f.type || '').startsWith('image/') || /\.(jpe?g|png|heic|heif|webp)$/i.test(name);
        if (isImage) {
          const ex = await readExif(f, name);
          Object.assign(meta, ex, meta.lat !== undefined ? { lat: meta.lat, lng: meta.lng } : {});
          if (ex.takenAt) meta.takenAt = ex.takenAt;
          if (!meta.takenAt) meta.takenAt = new Date(f.lastModified || it.added).toISOString();
          const qs = it.quality || quality();
          if (qs.preset !== 'original') {
            try { blob = await resize(f, qs.max, qs.q); name = name.replace(/\.[^.]+$/, '') + '.jpg'; } catch (_) { /* e.g. HEIC: upload the original */ }
          }
          meta.quality = qs.preset === 'original' ? 'original' : `${qs.max}px/${Math.round(qs.q * 100)}%`;
        }
        // removed from the queue meanwhile? then do not bring it back
        const still = await q('readonly', (st) => st.get(it.id));
        if (!still) continue;
        await qPut({ ...still, blob, name, meta: { ...meta, lat: still.meta.lat ?? meta.lat, lng: still.meta.lng ?? meta.lng }, raw: false });
        await refreshQueue();
        if (location.hash === '#/queue') viewQueue(); else renderUploadStatus();
        processQueue(); // upload while the next photo is prepared
      }
    } finally {
      preparing = false;
    }
  }

  // Only while originals are being stored is leaving risky; afterwards everything resumes on the next visit.
  window.addEventListener('beforeunload', (e) => {
    if (storing > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  async function processQueue(force = false) {
    if (uploading || !navigator.onLine || !state.user || state.user === 'offline') return;
    if (paused() && !force) { progress = 'Upload pausiert'; renderUploadStatus(); return; }
    uploading = true;
    try {
      let round = 0;
      for (;;) {
      await refreshQueue();
      // only prepared photos; those that failed for good (e.g. too large) wait for the user: retry or remove
      const todo = queueItems.filter((it) => !it.raw && (!it.error || (force && round === 0))).sort((a, b) => a.added - b.added);
      round++;
      if (!todo.length || (paused() && !force)) break;
      for (let i = 0; i < todo.length; i++) {
        if (paused() && !force) break;
        const it = todo[i];
        const left = queueItems.length;
        progress = `Lädt hoch … noch ${left} ${left === 1 ? 'Datei' : 'Dateien'}`;
        renderUploadStatus();
        live.set(it.id, { loaded: 0, total: it.blob.size });
        renderQueueProgress();
        try {
          await upload(it);
          await qDel(it.id);
          doneBytes += it.blob.size; doneCount++;
          const u = previewUrls.get(it.id); if (u) { URL.revokeObjectURL(u); previewUrls.delete(it.id); }
        } catch (e) {
          if (!e.status || e.status >= 500 || e.status === 401) throw e; // network/server: retry later
          it.error = e.message; // rejected: keep, show in the queue
          await qPut(it);
        } finally {
          live.delete(it.id);
        }
        await refreshQueue();
        if (location.hash === '#/queue') viewQueue();
      }
      }
      progress = paused() && !force ? 'Upload pausiert' : '';
    } catch (e) {
      progress = 'Upload unterbrochen – neuer Versuch folgt';
      setTimeout(processQueue, 20000);
    } finally {
      uploading = false;
      await refreshQueue();
      const m = location.hash.match(/^#\/site\/([a-f0-9]+)/);
      if (m) { photos = await api(`sites/${m[1]}/photos`).catch(() => photos); }
      await load().catch(() => {});
      if (!document.getElementById('lb') && !document.querySelector('dialog[open]')) render();
    }
  }
  window.addEventListener('online', processQueue);
  setInterval(processQueue, 60000);

  // ---------------------------------------------------------------- image handling
  async function readExif(file, name = file.name || '') {
    try {
      if (!/jpe?g/i.test(file.type) && !/\.jpe?g$/i.test(name)) return {};
      const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
      if (v.getUint16(0) !== 0xffd8) return {};
      let off = 2;
      while (off + 4 < v.byteLength) {
        const marker = v.getUint16(off), len = v.getUint16(off + 2);
        if (marker === 0xffe1 && v.getUint32(off + 4) === 0x45786966) return parseTiff(v, off + 10);
        if ((marker & 0xff00) !== 0xff00) break;
        off += 2 + len;
      }
    } catch (_) { /* ignore */ }
    return {};
  }
  function parseTiff(v, start) {
    const le = v.getUint16(start) === 0x4949;
    const u16 = (o) => v.getUint16(start + o, le), u32 = (o) => v.getUint32(start + o, le);
    const ifd = (o) => { const t = {}; const n = u16(o); for (let i = 0; i < n; i++) { const e = o + 2 + i * 12; t[u16(e)] = { count: u32(e + 4), off: e + 8 }; } return t; };
    const ascii = (t) => { const o = t.count > 4 ? u32(t.off) : t.off; let s = ''; for (let i = 0; i < t.count - 1; i++) s += String.fromCharCode(v.getUint8(start + o + i)); return s; };
    const rats = (t) => { const o = u32(t.off); const a = []; for (let i = 0; i < t.count; i++) a.push(u32(o + i * 8) / (u32(o + i * 8 + 4) || 1)); return a; };
    const res = {}, i0 = ifd(u32(4));
    if (i0[0x8769]) { const ex = ifd(u32(i0[0x8769].off)); if (ex[0x9003]) { const m = ascii(ex[0x9003]).match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/); if (m) res.takenAt = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).toISOString(); } }
    if (i0[0x8825]) {
      const g = ifd(u32(i0[0x8825].off));
      if (g[2] && g[4]) {
        const deg = (a) => a[0] + a[1] / 60 + a[2] / 3600;
        let lat = deg(rats(g[2])), lng = deg(rats(g[4]));
        if (g[1] && String.fromCharCode(v.getUint8(g[1].off)) === 'S') lat = -lat;
        if (g[3] && String.fromCharCode(v.getUint8(g[3].off)) === 'W') lng = -lng;
        if (Number.isFinite(lat) && (lat || lng)) { res.lat = lat; res.lng = lng; }
      }
    }
    return res;
  }
  async function resize(file, max = 3000, quality = 0.88) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close && bmp.close();
    return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('Bild konnte nicht umgewandelt werden'))), 'image/jpeg', quality));
  }
  const position = () => new Promise((res) => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });

  // ---------------------------------------------------------------- upload quality (per device)
  const PRESETS = {
    original: { label: 'Original', max: 0, q: 1, hint: 'unverändert' },
    large: { label: 'Groß', max: 3000, q: 0.88, hint: '3000 px · 88 %' },
    medium: { label: 'Mittel', max: 2000, q: 0.8, hint: '2000 px · 80 %' },
    small: { label: 'Klein', max: 1280, q: 0.7, hint: '1280 px · 70 %' },
  };
  const quality = () => {
    const qs = ls.get('quality', { preset: 'large' });
    if (qs.preset === 'custom') return { preset: 'custom', label: 'Eigene', max: qs.max || 2500, q: qs.q || 0.85 };
    return { preset: qs.preset in PRESETS ? qs.preset : 'large', ...PRESETS[qs.preset in PRESETS ? qs.preset : 'large'] };
  };
  const qualityText = (qs = quality()) => (qs.preset === 'original' ? 'Original (unverändert)' : `${qs.label} · ${qs.max} px · ${Math.round(qs.q * 100)} %`);
  // rough size of a typical 12-MP phone photo (4:3) for the chosen setting
  const estimate = (qs) => {
    if (qs.preset === 'original') return 'ca. 3–8 MB';
    const px = Math.min(qs.max, 4032);
    const mp = (px * px * 0.75) / 1e6;
    const bpp = 0.25 + Math.pow(qs.q, 4) * 1.5; // bytes per pixel, empirical for JPEG photos
    const mb = (mp * 1e6 * bpp) / 8 / 1e6 * 4;
    return mb < 1 ? `ca. ${Math.round(mb * 1000 / 50) * 50} KB` : `ca. ${mb.toFixed(1).replace('.', ',')} MB`;
  };
  function qualitySheet() {

      d.innerHTML = `<form method="dialog"><h2>Foto-Größe & Qualität</h2>
        <p class="help" style="margin:0">Gilt für alle neuen Fotos auf diesem Gerät. Kleiner = schnellerer Upload und weniger Speicher.</p>
        <div class="preset">${Object.entries(PRESETS).map(([k, p]) => `<button type="button" data-q="${k}" aria-pressed="${sel === k}"><b>${p.label}</b><span>${p.hint}</span></button>`).join('')}
          <button type="button" data-q="custom" aria-pressed="${sel === 'custom'}" style="grid-column:1/-1"><b>Eigene Einstellung</b><span>Größe und Qualität selbst wählen</span></button></div>

          <div class="field"><label for="qQ">JPEG-Qualität: <b id="qQV">${q} %</b></label><input type="range" id="qQ" min="40" max="100" step="1" value="${q}"></div>` : ''}
        <div class="hint info">Pro Foto (12 MP Handykamera): <b id="qEst">${estimate(qs)}</b></div>
        ${sel === 'original' ? '<p class="help" style="margin:0">Originale können sehr groß sein. Fotos über 16 MB lehnt der Server ab.</p>' : ''}
        <div class="actions"><button class="btn" value="cancel">Abbrechen</button><button class="btn primary" value="ok">Übernehmen</button></div></form>`;
      const mx = d.querySelector('#qMax'), qq = d.querySelector('#qQ');
      const upd = () => {

  /** Camera / gallery → resize → queue → upload */
  function pick(siteId, source) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = source === 'camera' ? 'image/*' : 'image/*,application/pdf';
    input.multiple = true;
    if (source === 'camera') input.setAttribute('capture', 'environment');
    input.className = 'visually-hidden';
    const pos = source === 'camera' ? position() : null;
    input.onchange = async () => {
      const files = Array.from(input.files || []);
      input.remove();
      if (!files.length) return;
      const category = ls.get('cat-' + siteId, 'vorher');
      const note = ((document.getElementById('upNote') || {}).value || '').trim();
      const qs = quality();
      const now = Date.now();
      // 1) all originals go into the queue at once (one transaction) – nothing is lost if the page is left now
      const items = files.map((f, i) => ({
        id: uid(), siteId, blob: f, name: f.name || 'foto.jpg', added: now + i, raw: true,
        source, quality: { preset: qs.preset, max: qs.max, q: qs.q },
        meta: { category, note, name: f.name || '', takenAt: source === 'camera' ? new Date(now).toISOString() : undefined },
      }));
      storing++;
      try {
        await q('readwrite', (st) => items.forEach((it) => st.put(it)));
      } catch (e) {
        toast('Fotos konnten nicht gespeichert werden: ' + e.message, 6000);
        return;
      } finally {
        storing--;
      }
      const n = document.getElementById('upNote'); if (n) n.value = '';
      toast(`${items.length} ${items.length === 1 ? 'Foto ist' : 'Fotos sind'} in der Warteschlange – die Seite darf jetzt verlassen werden.`, 3500);
      // camera: add the position once it is known (if the photos are not prepared yet)
      if (pos) pos.then(async (p) => {
        if (!p) return;
        for (const it of items) {
          const cur = await q('readonly', (st) => st.get(it.id));
          if (cur && cur.raw && cur.meta.lat === undefined) { cur.meta.lat = p.lat; cur.meta.lng = p.lng; await qPut(cur); }
        }
      });
      await refreshQueue();
      if (!document.getElementById('lb')) render();
      prepareQueue();
    };
    document.body.appendChild(input);
    input.click();
  }

  /** Update bars in place while bytes flow (no re-render). */
  function renderQueueProgress() {
    if (location.hash !== '#/queue') return;
    const waiting = queueItems.reduce((n, it) => n + it.blob.size, 0);
    let inFlight = 0;
    live.forEach((l, id) => {
      inFlight += l.loaded;
      const row = document.querySelector(`[data-qid="${id}"]`);
      if (!row) return;
      const pct = Math.round((l.loaded / (l.total || 1)) * 100);
      row.querySelector('[data-qbar]').style.width = pct + '%';
      row.querySelector('[data-qtext]').textContent = `Lädt hoch … ${pct} %`;
    });
    const total = waiting + doneBytes;
    const pct = total ? Math.round(((doneBytes + inFlight) / total) * 100) : 100;
    const bar = document.querySelector('[data-q-total]'); if (bar) bar.style.width = pct + '%';
    const p = document.querySelector('[data-q-pct]'); if (p) p.textContent = pct + ' %';
    const st = document.querySelector('[data-q-status]'); if (st && progress) st.textContent = progress;
  }

    lb.id = 'lb';
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    document.body.appendChild(lb);
    const draw = () => {
      const p = list[i];
      const isPdf = /\.pdf$/i.test(p.path);
      lb.innerHTML = `<div class="lb-top"><button data-lb="close">Schließen</button><span style="font-size:13px">${i + 1} / ${list.length}</span><a href="${photoUrl(p.id, '&download=1')}" download>Original</a></div>
        <div class="lb-img">${isPdf ? `<a class="btn" href="${photoUrl(p.id)}" target="_blank">PDF öffnen</a>` : `<img src="${photoUrl(p.id)}" alt="${esc(state.categories[p.category])}">`}
          ${i > 0 ? '<button class="nav prev" data-lb="prev" aria-label="Vorheriges Foto">‹</button>' : ''}${i < list.length - 1 ? '<button class="nav next" data-lb="next" aria-label="Nächstes Foto">›</button>' : ''}</div>
        <div class="lb-info">
          <div class="help">${esc(fmtTs(p.takenAt || p.uploadedAt))} · hochgeladen von ${esc(p.uploadedBy)}${p.lat != null ? ` · <a href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lng}#map=18/${p.lat}/${p.lng}" target="_blank" rel="noopener">Ort auf Karte</a>` : ''}</div>
          <div class="field"><label for="lbCat">Kategorie</label><select id="lbCat">${Object.entries(state.categories).map(([k, l]) => `<option value="${k}" ${k === p.category ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
          <div class="field"><label for="lbNote">Notiz</label><input id="lbNote" value="${esc(p.note)}"></div>
          <div class="actions"><button class="btn danger" data-lb="remove">Entfernen</button><button class="btn" data-lb="share">Teilen</button><button class="btn blue" data-lb="save">Speichern</button></div>
          <div class="help">Ablage: ${esc(p.path)}</div>
        </div>`;
    };
    draw();
    const close = () => { lb.remove(); document.removeEventListener('keydown', onKey); render(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft' && i > 0) { i--; draw(); } if (e.key === 'ArrowRight' && i < list.length - 1) { i++; draw(); } };
    document.addEventListener('keydown', onKey);
    let x0 = null;
    lb.addEventListener('pointerdown', (e) => { if (e.target.closest('.lb-img')) x0 = e.clientX; });
    lb.addEventListener('pointerup', (e) => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (dx > 60 && i > 0) { i--; draw(); } else if (dx < -60 && i < list.length - 1) { i++; draw(); } });
    lb.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-lb]'); if (!b) return;
      const a = b.dataset.lb, p = list[i];
      if (a === 'share') return sendSheet(siteId, [p.id]);
      if (a === 'close') close();
      else if (a === 'prev') { i--; draw(); }
      else if (a === 'next') { i++; draw(); }
      else if (a === 'save') {
        try {
          const upd = await post(`photos/${p.id}`, { category: lb.querySelector('#lbCat').value, note: lb.querySelector('#lbNote').value });
          Object.assign(p, upd); const k = photos.findIndex((x) => x.id === p.id); if (k >= 0) photos[k] = upd;
          toast('Gespeichert'); draw();
        } catch (err) { toast(err.message, 5000); }
      } else if (a === 'remove') {
        if (!confirm('Foto entfernen? Es wird auf dem Server in den Ordner „_entfernt“ verschoben.')) return;
        try {
          await post(`photos/${p.id}/remove`, {});
          photos = photos.filter((x) => x.id !== p.id); list.splice(i, 1);
          const s = state.sites.find((x) => x.id === siteId); if (s) s.photoCount--;
          toast('Entfernt');
          if (!list.length) close(); else { i = Math.min(i, list.length - 1); draw(); }
        } catch (err) { toast(err.message, 5000); }
      }
    });
  }

  // ---------------------------------------------------------------- share links for observers
  const shareLink = (token) => new URL(`share.php?t=${token}`, location.href).href;
  async function copyLink(link, label) {
    if (navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      try { await navigator.share({ title: 'Baustellen-Fotos', text: `Fotos der Baustelle${label ? ' für ' + label : ''}:`, url: link }); return; } catch (_) { /* cancelled */ }
    }
    try { await navigator.clipboard.writeText(link); toast('Link kopiert'); } catch (_) { prompt('Link zum Kopieren:', link); }
  }
  async function shareSheet(siteId) {
    const site = state.sites.find((s) => s.id === siteId);
    const d = document.createElement('dialog');
    d.className = 'sheet';
    document.body.appendChild(d);
    const draw = async () => {
      let list = [];
      try { list = await api(`sites/${siteId}/shares`); } catch (e) { toast(e.message); }
      const status = (s) => s.revokedAt ? 'gesperrt' : !s.active ? 'abgelaufen' : s.expiresAt ? `gültig bis ${new Date(s.expiresAt).toLocaleDateString('de-DE')}` : 'unbegrenzt gültig';
      d.innerHTML = `<form method="dialog" id="shForm"><h2>„${esc(site.name)}“ teilen</h2>
        <p class="help" style="margin:0">Der Beobachter sieht nur diese Baustelle, ohne Login und ohne Notizen, und kann Fotos ansehen und als ZIP laden – aber nichts ändern.</p>
        <div class="field"><label for="shLabel">Für wen ist der Link?</label><input id="shLabel" placeholder="z. B. Bauherr Müller, Gutachter"></div>
        <div class="field"><label for="shDays">Gültig</label><select id="shDays"><option value="7">7 Tage</option><option value="30" selected>30 Tage</option><option value="90">90 Tage</option><option value="0">unbegrenzt (bis zum Sperren)</option></select></div>
        <button type="button" class="btn primary" data-sh="create">Link erstellen</button>
        ${list.length ? `<div class="lbl" style="margin-top:6px">Bestehende Links</div>${list.map((s) => `<div class="card" style="padding:10px;gap:6px">
          <div class="row"><b>${esc(s.label)}${s.photoIds ? ` <span class="help">(${s.photoIds.length} ${s.photoIds.length === 1 ? 'Foto' : 'Fotos'})</span>` : ''}</b><span class="help">${esc(status(s))}</span></div>
          <div class="help">erstellt ${esc(fmtTs(s.createdAt))} von ${esc(s.createdBy)} · ${s.accessCount}× geöffnet${s.lastAccessAt ? ', zuletzt ' + esc(fmtTs(s.lastAccessAt)) : ''}</div>
          ${s.active ? `<div class="actions"><button type="button" class="btn small" data-sh="copy" data-token="${s.token}" data-label="${esc(s.label)}">Link kopieren / senden</button><button type="button" class="btn small danger" data-sh="revoke" data-id="${s.id}">Sperren</button></div>` : ''}</div>`).join('')}` : ''}
        <button class="btn" value="close">Schließen</button></form>`;
    };
    d.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-sh]'); if (!b) return;
      if (b.dataset.sh === 'create') {
        const label = d.querySelector('#shLabel').value.trim();
        if (!label) { toast('Bitte angeben, für wen der Link ist'); d.querySelector('#shLabel').focus(); return; }
        try {
          const s = await post(`sites/${siteId}/shares`, { label, days: Number(d.querySelector('#shDays').value) });
          await draw();
          copyLink(shareLink(s.token), label);
        } catch (err) { toast(err.message, 5000); }
      } else if (b.dataset.sh === 'copy') copyLink(shareLink(b.dataset.token), b.dataset.label);
      else if (b.dataset.sh === 'revoke') {
        if (!confirm('Link sperren? Er funktioniert danach sofort nicht mehr.')) return;
        try { await post(`shares/${b.dataset.id}/revoke`, {}); toast('Link gesperrt'); await draw(); } catch (err) { toast(err.message, 5000); }
      }
    });
    d.addEventListener('close', () => d.remove());
    await draw();
    d.showModal();
  }

  /** Share the given photos: as files (WhatsApp, mail …), as ZIP, or as a link limited to them. */
  function sendSheet(siteId, ids) {
    const n = ids.length;
    const d = document.createElement('dialog');
    d.className = 'sheet';
    d.innerHTML = `<form method="dialog"><h2>${n === 1 ? 'Foto teilen' : `${n} Fotos teilen`}</h2>
      <button type="button" class="btn primary big" data-s="files">Als ${n === 1 ? 'Foto' : 'Fotos'} senden (WhatsApp, Mail …)</button>
      <button type="button" class="btn big" data-s="zip">${n === 1 ? 'Herunterladen' : 'Als ZIP herunterladen'}</button>
      <div class="card" style="padding:12px;gap:8px"><b>Link nur für ${n === 1 ? 'dieses Foto' : 'diese Fotos'}</b>
        <div class="field"><label for="slLabel">Für wen?</label><input id="slLabel" placeholder="z. B. Bauherr Müller"></div>
        <div class="field"><label for="slDays">Gültig</label><select id="slDays"><option value="7">7 Tage</option><option value="30" selected>30 Tage</option><option value="90">90 Tage</option><option value="0">unbegrenzt (bis zum Sperren)</option></select></div>
        <button type="button" class="btn blue" data-s="link">Link erstellen</button>
        <p class="help" style="margin:0">Der Link zeigt nur ${n === 1 ? 'dieses Foto' : 'diese Fotos'}, ohne Login. Verwalten und sperren unter „Teilen“ der Baustelle.</p></div>
      <p class="help" data-s-status style="margin:0"></p>
      <button class="btn" value="close">Schließen</button></form>`;
    document.body.appendChild(d);
    const status = (t) => (d.querySelector('[data-s-status]').textContent = t);
    d.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      if (b.dataset.s === 'zip') {
        location.href = n === 1 ? photoUrl(ids[0], '&download=1') : `api.php?p=sites/${siteId}/zip&ids=${ids.join(',')}`;
      } else if (b.dataset.s === 'files') {
        try {
          if (n > 30) { status('Bitte höchstens 30 Fotos auf einmal senden – oder als ZIP/Link teilen.'); return; }
          status('Fotos werden geladen …');
          const files = [];
          for (const id of ids) {
            const r = await fetch(photoUrl(id), { credentials: 'same-origin' });
            if (!r.ok) throw new Error('Foto konnte nicht geladen werden');
            const blob = await r.blob();
            const p = photos.find((x) => x.id === id);
            files.push(new File([blob], (p && p.path ? p.path.split('/').pop() : id + '.jpg'), { type: blob.type || 'image/jpeg' }));
          }
          if (navigator.canShare && navigator.canShare({ files })) {
            status('');
            await navigator.share({ files, title: 'Baustellen-Fotos' });
          } else {
            status('Dieses Gerät kann keine Dateien direkt teilen – die Fotos werden heruntergeladen.');
            if (n === 1) location.href = photoUrl(ids[0], '&download=1'); else location.href = `api.php?p=sites/${siteId}/zip&ids=${ids.join(',')}`;
          }
        } catch (err) { if (err.name !== 'AbortError') status(err.message); else status(''); }
      } else if (b.dataset.s === 'link') {
        const label = d.querySelector('#slLabel').value.trim();
        if (!label) { toast('Bitte angeben, für wen der Link ist'); d.querySelector('#slLabel').focus(); return; }
        try {
          const sh = await post(`sites/${siteId}/shares`, { label, days: Number(d.querySelector('#slDays').value), photoIds: ids });
          await copyLink(shareLink(sh.token), label);
          status('Link erstellt.');
        } catch (err) { toast(err.message, 5000); }
      }
    });
    d.addEventListener('close', () => d.remove());
    d.showModal();
  }

  // ---------------------------------------------------------------- site form
  function siteSheet(site) {
    const d = document.createElement('dialog');
    d.className = 'sheet';
    const dl = `<datalist id="dlc">${customers.map((c) => `<option value="${esc(c.name)}"></option>`).join('')}</datalist>`;
    d.innerHTML = `<form method="dialog"><h2>${site ? 'Baustelle bearbeiten' : 'Neue Baustelle'}</h2>
      <div class="field"><label for="sName">Name der Baustelle *</label><input id="sName" required value="${esc(site ? site.name : '')}" placeholder="z. B. WP Müller Musterstadt"></div>
      <div class="field"><label for="sCust">Kunde</label><input id="sCust" list="dlc" value="${esc(site ? site.customer : '')}"></div>
      <div class="field"><label for="sAddr">Adresse</label><input id="sAddr" value="${esc(site ? site.address : '')}"></div>
      <div class="field"><label for="sNote">Notiz</label><textarea id="sNote">${esc(site ? site.note : '')}</textarea></div>
      ${site ? `<label class="row" style="justify-content:flex-start;gap:10px;font-size:14px"><input type="checkbox" id="sArch" style="width:22px;min-height:22px" ${site.archived ? 'checked' : ''}> Archiviert (abgeschlossen)</label>` : ''}
      <div class="actions"><button class="btn" value="cancel" formnovalidate>Abbrechen</button><button class="btn primary" value="ok">Speichern</button></div>${dl}</form>`;
    document.body.appendChild(d);
    const cust = d.querySelector('#sCust');
    cust.addEventListener('change', () => {
      const c = customers.find((x) => x.name === cust.value);
      if (c && !d.querySelector('#sAddr').value) d.querySelector('#sAddr').value = c.address;
      if (c && !d.querySelector('#sName').value) d.querySelector('#sName').value = c.name;
    });
    d.addEventListener('close', async () => {
      if (d.returnValue === 'ok') {
        const id = site ? site.id : uid();
        try {
          await post(`sites/${id}`, { name: d.querySelector('#sName').value, customer: cust.value, address: d.querySelector('#sAddr').value, note: d.querySelector('#sNote').value, archived: site ? d.querySelector('#sArch').checked : false });
          await load();
          if (!site) { photos = []; location.hash = `#/site/${id}`; } else render();
        } catch (err) { toast(err.message, 5000); }
      }
      d.remove();
    });
    d.showModal();
  }

  // ---------------------------------------------------------------- routing & events
  let lastSite = null;
  async function render() {
    if (!state.user) return viewLogin();
    const m = location.hash.match(/^#\/site\/([a-f0-9]+)$/);
    if (m) {
      if (lastSite !== m[1]) { lastSite = m[1]; filter = 'alle'; selecting = false; selected.clear(); photos = []; viewSite(m[1]); photos = await api(`sites/${m[1]}/photos`).catch(() => []); }
      return viewSite(m[1]);
    }
    lastSite = null;
    selecting = false; selected.clear();
    if (location.hash === '#/queue') return viewQueue();
    viewSites();
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  $app.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]'); if (go) { location.hash = go.dataset.go; return; }
    const ph = e.target.closest('[data-photo]');
    if (ph) {
      if (longPressed) { longPressed = false; return; }
      if (selecting) { toggleSel(ph.dataset.photo); return; }
      return openPhoto(ph.dataset.photo);
    }
    const f = e.target.closest('[data-filter]'); if (f) { filter = f.dataset.filter; return viewSite(location.hash.split('/')[2]); }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'new-site') siteSheet(null);
    else if (a === 'share') shareSheet(location.hash.split('/')[2]);
    else if (a === 'quality') qualitySheet();
    else if (a === 'q-pause') { ls.set('paused', true); progress = 'Upload pausiert'; viewQueue(); }
    else if (a === 'q-resume') { ls.set('paused', false); progress = ''; viewQueue(); processQueue(); }
    else if (a === 'q-now') { ls.set('paused', false); processQueue(true); }
    else if (a === 'q-retry') {
      const it = queueItems.find((x) => x.id === b.dataset.id);
      if (it) { delete it.error; qPut(it).then(() => { refreshQueue().then(viewQueue); processQueue(); }); }
    } else if (a === 'q-remove') {
      if (!confirm('Dieses Foto aus der Warteschlange entfernen? Es wird dann nicht hochgeladen.')) return;
      qDel(b.dataset.id).then(async () => { const u = previewUrls.get(b.dataset.id); if (u) { URL.revokeObjectURL(u); previewUrls.delete(b.dataset.id); } await refreshQueue(); viewQueue(); });
    }
    else if (a === 'sel-start') { selecting = true; selected.clear(); viewSite(location.hash.split('/')[2]); }
    else if (a === 'sel-end') { selecting = false; selected.clear(); viewSite(location.hash.split('/')[2]); }
    else if (a === 'sel-all') {
      const ids = photos.filter((p) => filter === 'alle' || p.category === filter).map((p) => p.id);
      const all = ids.length && ids.every((x) => selected.has(x));
      ids.forEach((x) => (all ? selected.delete(x) : selected.add(x)));
      viewSite(location.hash.split('/')[2]);
    } else if (a === 'sel-day') {
      const ids = photos.filter((p) => p.day === b.dataset.day && (filter === 'alle' || p.category === filter)).map((p) => p.id);
      const all = ids.every((x) => selected.has(x));
      ids.forEach((x) => (all ? selected.delete(x) : selected.add(x)));
      viewSite(location.hash.split('/')[2]);
    } else if (a === 'sel-share') sendSheet(location.hash.split('/')[2], [...selected]);
    else if (a === 'sel-delete') deleteSelected(location.hash.split('/')[2]);
    else if (a === 'edit-site') siteSheet(state.sites.find((s) => s.id === location.hash.split('/')[2]));
    else if (a === 'pick') pick(location.hash.split('/')[2], b.dataset.src);
    else if (a === 'arch') { showArchived = b.dataset.v === '1'; viewSites(); }
  });

  function toggleSel(id) {
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    const y = window.scrollY;
    viewSite(location.hash.split('/')[2]);
    window.scrollTo(0, y);
  }

  async function deleteSelected(siteId) {
    const n = selected.size;
    if (!n || !confirm(`${n} ${n === 1 ? 'Foto' : 'Fotos'} löschen? Sie werden auf dem Server in den Ordner „_entfernt“ verschoben.`)) return;
    try {
      await post('photos/remove', { ids: [...selected] });
      photos = photos.filter((p) => !selected.has(p.id));
      const s = state.sites.find((x) => x.id === siteId); if (s) s.photoCount = photos.length;
      selected.clear(); selecting = false;
      toast(`${n} ${n === 1 ? 'Foto' : 'Fotos'} gelöscht`);
      viewSite(siteId);
      load().catch(() => {});
    } catch (err) { toast(err.message, 5000); }
  }

  // long press on a photo starts the selection
  let pressTimer = null, longPressed = false;
  $app.addEventListener('pointerdown', (e) => {
    longPressed = false; // a long press re-renders the grid, so its own click never arrives
    const ph = e.target.closest('[data-photo]');
    if (!ph || selecting) return;
    pressTimer = setTimeout(() => {
      longPressed = true;
      selecting = true; selected.clear(); selected.add(ph.dataset.photo);
      if (navigator.vibrate) navigator.vibrate(20);
      const y = window.scrollY; viewSite(location.hash.split('/')[2]); window.scrollTo(0, y);
    }, 500);
  });
  ['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach((ev) => $app.addEventListener(ev, () => clearTimeout(pressTimer), { passive: true }));
  $app.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-photo]')) e.preventDefault(); });

  async function boot() {
    try { await load(); } catch (e) { if (e.status === 401) return; toast('Server nicht erreichbar – Fotos werden auf dem Gerät gesammelt', 5000); state.user = state.user || 'offline'; }
    await refreshQueue().catch(() => {});
    render();
    prepareQueue(); // photos selected before the page was left are prepared now
    processQueue();
  }
  boot();
})();
</script>
</body>
</html>
